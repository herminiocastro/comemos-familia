<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Comemos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Comemos</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--txt:#223028;--mut:#6d776f;--line:#e4dfd6;--acc:#2f704f;--soft:#e8f3ec;--bad:#9b4242;--shadow:0 8px 30px #24352a12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:12px 12px 92px}.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 80%,transparent);display:flex;align-items:center;justify-content:space-between;padding:8px 0 16px}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:14px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:22px}.brand h1{font-size:22px;margin:0}.mut{color:var(--mut);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}h2,h3{margin:0 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.people{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.person{border:1px solid var(--line);background:#fff;border-radius:16px;padding:10px 4px;text-align:center}.person.on{background:var(--soft);border-color:var(--acc)}.person span{display:block;font-size:22px}.btn,.mini{border:0;border-radius:13px;padding:11px 14px;font-weight:700}.btn{background:var(--acc);color:#fff}.btn.alt,.mini{background:#fff;color:var(--txt);border:1px solid var(--line)}.btn.full{width:100%}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px;background:#fff}.field textarea{min-height:74px}.recipe{display:grid;gap:8px}.rhead{display:flex;justify-content:space-between;gap:10px}.rname{font-weight:800;font-size:18px}.tags{display:flex;flex-wrap:wrap;gap:5px}.tag{background:#f1f2ef;border-radius:999px;padding:5px 8px;font-size:11px}.ok{background:#edf7ef;color:#2f704f;padding:8px;border-radius:11px;font-size:12px}.no{background:#fff0ef;color:var(--bad);padding:8px;border-radius:11px;font-size:12px}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fffffff2;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:transparent;padding:8px 3px;color:var(--mut)}.nav button.on{color:var(--acc);font-weight:800;background:var(--soft);border-radius:12px}.nav b{display:block;font-size:19px}.nav small{font-size:10px}.tabs{display:flex;gap:6px;overflow:auto}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;white-space:nowrap}.tabs button.on{background:var(--acc);color:#fff}.notice{background:#fff8e9;border:1px solid #ecddb3;border-radius:14px;padding:12px;margin-bottom:12px}.day{padding:10px 0;border-bottom:1px solid var(--line)}.day:last-child{border-bottom:0}.meal{display:flex;justify-content:space-between;gap:8px;margin:7px 0}.overlay{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;z-index:30}.sheet{width:min(760px,100%);max-height:88vh;overflow:auto;margin:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom))}.x{float:right;border:0;background:#fff;border-radius:10px;padding:7px}.step{display:flex;gap:8px;margin:9px 0;line-height:1.35}.step i{font-style:normal;width:25px;height:25px;flex:0 0 25px;background:var(--acc);color:#fff;border-radius:50%;display:grid;place-items:center;font-size:12px}.section{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px}.section h2{font-size:18px;margin:0}@media(max-width:500px){.app{padding-left:9px;padding-right:9px}.card{padding:14px}.grid{grid-template-columns:1fr}.people{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body><div id="root"></div>
<script>
const R=[
['Arroz salteado con pollo y huevo',['comida','cena'],20,['alta proteína','hidratos'],['pollo','arroz','huevo','cebolla','zanahoria'],620,43,66,['Cuece el arroz si hace falta.','Dora el pollo troceado.','Añade cebolla y zanahoria.','Cuaja el huevo en la misma sartén.','Añade el arroz y saltea todo junto.']],
['Pasta cremosa de pollo y calabacín',['comida','cena'],25,['alta proteína','hidratos'],['pasta','pollo','calabacín','queso crema','ajo'],590,40,68,['Cuece la pasta.','Dora pollo y ajo.','Añade calabacín.','Incorpora queso crema y un poco de agua de cocción.','Mezcla con la pasta.']],
['Tortilla francesa con patata y tomate',['cena'],15,['rápida','ligera','proteína'],['huevo','patata','tomate'],430,25,39,['Cuece la patata en microondas.','Haz la tortilla francesa.','Corta y aliña el tomate.','Sirve todo junto.']],
['Fajitas rápidas de pollo',['comida','cena'],20,['alta proteína','rápida'],['pollo','tortilla de trigo','pimiento','cebolla','yogur'],560,42,55,['Corta pollo, pimiento y cebolla.','Saltea 8-10 minutos.','Calienta las tortillas.','Rellena y añade yogur como salsa.']],
['Salmón al horno con patata',['comida','cena'],35,['alta proteína','equilibrada'],['salmón','patata','calabacín','cebolla'],610,39,46,['Hornea patata fina 15 minutos a 200 ºC.','Añade verduras.','Coloca el salmón encima.','Hornea 12-15 minutos más.']],
['Hamburguesa casera con patatas airfryer',['comida','cena'],30,['proteína','familiar'],['carne picada','pan','patata','lechuga','tomate','queso'],720,42,70,['Cocina las patatas en airfryer.','Forma y cocina las hamburguesas.','Monta con lechuga, tomate y queso.']],
['Pollo crujiente airfryer con arroz',['comida','cena'],25,['alta proteína','hidratos','familiar'],['pollo','arroz','pan rallado','huevo'],600,46,65,['Corta el pollo en tiras.','Pásalo por huevo y pan rallado.','Airfryer 12-15 minutos a 190 ºC.','Sirve con arroz.']],
['Lentejas rápidas con verduras y huevo',['comida'],25,['fibra','proteína','saciante'],['lentejas','huevo','zanahoria','cebolla','pimiento','tomate'],520,28,67,['Sofríe las verduras.','Añade tomate.','Incorpora las lentejas y un poco de agua.','Cuece 10 minutos y sirve con huevo.']],
['Macarrones con carne y tomate',['comida'],30,['familiar','hidratos','proteína'],['pasta','carne picada','tomate','cebolla','queso'],690,38,79,['Cuece los macarrones.','Sofríe cebolla y carne.','Añade tomate y cocina 10 minutos.','Mezcla y termina con queso.']],
['Merluza con puré de patata',['comida','cena'],25,['proteína','ligera'],['merluza','patata','leche','limón'],470,36,46,['Cuece la patata y haz puré.','Cocina la merluza a la plancha.','Sirve con limón.']],
['Pizza rápida de tortilla',['cena'],15,['rápida','familiar'],['tortilla de trigo','tomate','queso','jamón cocido'],480,27,45,['Pon tomate sobre la tortilla.','Añade queso y jamón.','Hornea o airfryer 7-9 minutos.']],
['Quesadillas de pollo y queso',['cena'],15,['rápida','familiar','proteína'],['tortilla de trigo','pollo','queso','tomate'],540,39,42,['Pon pollo, queso y tomate en media tortilla.','Dobla.','Dora por ambos lados en sartén.']]
].map((x,i)=>({id:'r'+(i+1),name:x[0],meal:x[1],time:x[2],tags:x[3],ingredients:x[4],kcal:x[5],protein:x[6],carbs:x[7],steps:x[8]}));
const seed={people:[1,2,3,4].map((n,i)=>({id:'p'+n,name:'Persona '+n,emoji:['👨','👩','🧑','🧒'][i],likes:[],dislikes:[]})),favorites:[],history:[],week:{}};let S=JSON.parse(localStorage.getItem('comemos-v2')||'null')||structuredClone(seed),view='home',selected=S.people.map(p=>p.id),modal=null,tab='p1';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function save(){localStorage.setItem('comemos-v2',JSON.stringify(S))}function p(id){return S.people.find(x=>x.id===id)}function match(r,a){let h=norm(r.name+' '+r.ingredients.join(' ')+' '+r.tags.join(' '));return (a||[]).some(x=>x&&h.includes(norm(x)))}
function comp(r,ids=selected){let bad=[];ids.forEach(id=>{let q=p(id);if(q&&match(r,q.dislikes))bad.push(q.name)});return bad}
function score(r,f={},ids=selected){let n=100,b=comp(r,ids);n-=b.length*100;ids.forEach(id=>{let q=p(id);if(q&&match(r,q.likes))n+=10});if(f.time)n+=r.time<=f.time?15:-(r.time-f.time)*2;if(f.meal)n+=r.meal.includes(f.meal)?20:-30;if(f.goal)n+=r.tags.some(t=>norm(t).includes(norm(f.goal)))?20:0;if(f.have)f.have.split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>{if(match(r,[x]))n+=8});if(S.history.slice(-8).includes(r.id))n-=15;return n}
function rec(f={},ids=selected){return R.map(r=>({r,s:score(r,f,ids),bad:comp(r,ids)})).sort((a,b)=>b.s-a.s)}function altFor(id,avoid,f={}){return rec(f,[id]).find(x=>x.r.id!==avoid&&!x.bad.length)?.r}
function people(){return `<div class="people">${S.people.map(q=>`<button class="person ${selected.includes(q.id)?'on':''}" data-person="${q.id}"><span>${q.emoji}</span><b>${esc(q.name)}</b></button>`).join('')}</div>`}
function card(r,f={}){let bad=comp(r),alts=bad.map(name=>{let q=S.people.find(x=>x.name===name),a=q&&altFor(q.id,r.id,f);return a?`${esc(name)} → ${esc(a.name)}`:''}).filter(Boolean);return `<div class="card recipe"><div class="rhead"><div><div class="rname">${esc(r.name)}</div><div class="mut">${r.time} min · ${r.protein} g proteína · ${r.carbs} g HC</div></div><button class="mini" data-fav="${r.id}">${S.favorites.includes(r.id)?'♥':'♡'}</button></div><div class="tags">${r.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="${bad.length?'no':'ok'}">${bad.length?'No encaja con: '+bad.join(', '):'Compatible con los seleccionados'}${alts.length?'<br><b>Alternativa:</b> '+alts.join(' · '):''}</div><button class="btn alt" data-open="${r.id}">Ver receta</button></div>`}
function home(){let best=rec({time:25}).find(x=>!x.bad.length)?.r;return `${S.people.some(x=>/^Persona \d$/.test(x.name))?'<div class="notice"><b>Primero configura la familia</b><div class="mut">Pon nombres, gustos y alimentos que queréis evitar.</div><button class="btn" data-view="family" style="margin-top:8px">Configurar</button></div>':''}<div class="card"><h2>¿Qué cocinamos hoy?</h2><div class="grid"><button class="btn alt" data-quick="20">⚡ Algo rápido</button><button class="btn alt" data-quick="protein">💪 Alta proteína</button></div></div><div class="section"><h2>¿Para quién?</h2></div>${people()}<div class="section"><h2>Sugerencia</h2></div>${best?card(best):''}`}
function search(){return `<div class="card"><h2>Buscar comida</h2>${people()}<div class="grid"><div class="field"><label>Momento</label><select id="meal"><option value="">Cualquiera</option><option>comida</option><option>cena</option></select></div><div class="field"><label>Tiempo máximo</label><select id="time"><option value="0">Sin límite</option><option>15</option><option>20</option><option>25</option><option>30</option><option>45</option></select></div></div><div class="field"><label>Objetivo</label><select id="goal"><option value="">Cualquiera</option><option value="alta proteína">Alta proteína</option><option value="hidratos">Hidratos</option><option value="ligera">Ligera</option><option value="familiar">Familiar</option></select></div><div class="field"><label>Ingredientes que quieres usar</label><input id="have" placeholder="pollo, arroz, huevos..."></div><label class="mut"><input type="checkbox" id="strict" checked> Ocultar platos con algo que no guste</label><button class="btn full" data-action="find" style="margin-top:12px">Buscar</button></div><div id="results"></div>`}
function family(){let q=p(tab);return `<div class="card"><h2>Familia y gustos</h2><div class="tabs">${S.people.map(x=>`<button class="${x.id===tab?'on':''}" data-tab="${x.id}">${x.emoji} ${esc(x.name)}</button>`).join('')}</div><div class="field"><label>Nombre</label><input id="pn" value="${esc(q.name)}"></div><div class="field"><label>Icono</label><select id="pe">${['👨','👩','🧑','👧','🧒','👦'].map(e=>`<option ${e===q.emoji?'selected':''}>${e}</option>`).join('')}</select></div><div class="field"><label>Le gusta</label><textarea id="pl" placeholder="pollo, pasta, arroz...">${esc(q.likes.join(', '))}</textarea></div><div class="field"><label>No le gusta / evitar</label><textarea id="pd" placeholder="cebolla, pescado, brócoli...">${esc(q.dislikes.join(', '))}</textarea></div><button class="btn full" data-action="save-person">Guardar</button></div><div class="card"><b>Cómo funciona</b><div class="mut">Si un plato contiene algo marcado como “no le gusta”, se descarta para esa persona o se propone un segundo plato.</div></div>`}
function week(){let days=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];return `<div class="card"><h2>Menú semanal</h2><div class="mut">Genera comidas y cenas compatibles con todos los seleccionados.</div><button class="btn full" data-action="week" style="margin-top:10px">${Object.keys(S.week).length?'Regenerar':'Crear menú'}</button></div>${Object.keys(S.week).length?`<div class="card">${days.map(d=>`<div class="day"><b>${d}</b>${['comida','cena'].map(m=>{let r=R.find(x=>x.id===S.week[d]?.[m]);return `<div class="meal"><span class="mut">${m}</span><span>${r?esc(r.name):'—'}</span></div>`}).join('')}</div>`).join('')}</div>`:''}`}
function body(){return view==='home'?home():view==='search'?search():view==='family'?family():week()}
function nav(){return `<nav class="nav">${[['home','⌂','Hoy'],['search','⌕','Buscar'],['week','▦','Semana'],['family','☺','Familia']].map(x=>`<button class="${view===x[0]?'on':''}" data-view="${x[0]}"><b>${x[1]}</b><small>${x[2]}</small></button>`).join('')}</nav>`}
function modalHtml(){if(!modal)return'';let r=R.find(x=>x.id===modal);return `<div class="overlay" data-close><div class="sheet" onclick="event.stopPropagation()"><button class="x" data-close>✕</button><h2>${esc(r.name)}</h2><div class="mut">${r.kcal} kcal · ${r.protein} g proteína · ${r.carbs} g hidratos</div><div class="card"><h3>Ingredientes</h3>${r.ingredients.map(i=>`<span class="tag">${esc(i)}</span>`).join(' ')}</div><div class="card"><h3>Preparación</h3>${r.steps.map((s,i)=>`<div class="step"><i>${i+1}</i><span>${esc(s)}</span></div>`).join('')}</div><button class="btn full" data-done="${r.id}">La hemos hecho</button></div></div>`}
function render(){document.getElementById('root').innerHTML=`<div class="app"><div class="top"><div class="brand"><div class="logo">🍽️</div><div><h1>Comemos</h1><div class="mut">Qué cocinar sin darle vueltas</div></div></div></div>${body()}</div>${nav()}${modalHtml()}`;bind()}
function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;modal=null;render()});document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{let id=b.dataset.person;if(selected.includes(id)){if(selected.length>1)selected=selected.filter(x=>x!==id)}else selected.push(id);render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{modal=b.dataset.open;render()});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=e=>{if(e.target===b){modal=null;render()}});document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{let id=b.dataset.fav;S.favorites=S.favorites.includes(id)?S.favorites.filter(x=>x!==id):[...S.favorites,id];save();render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelector('[data-action="save-person"]')?.addEventListener('click',()=>{let q=p(tab);q.name=$('#pn').value.trim()||q.name;q.emoji=$('#pe').value;q.likes=$('#pl').value.split(',').map(x=>x.trim()).filter(Boolean);q.dislikes=$('#pd').value.split(',').map(x=>x.trim()).filter(Boolean);save();render()});document.querySelector('[data-action="find"]')?.addEventListener('click',find);document.querySelector('[data-action="week"]')?.addEventListener('click',makeWeek);document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{view='search';render();setTimeout(()=>{if(b.dataset.quick==='20')$('#time').value='20';else $('#goal').value='alta proteína';find()},0)});document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{S.history.push(b.dataset.done);S.history=S.history.slice(-60);save();modal=null;render()})}
function find(){let f={meal:$('#meal').value,time:+$('#time').value,goal:$('#goal').value,have:$('#have').value},a=rec(f);if($('#strict').checked)a=a.filter(x=>!x.bad.length);$('#results').innerHTML=`<div class="section"><h2>Mejores opciones</h2></div>${a.slice(0,8).map(x=>card(x.r,f)).join('')||'<div class="card mut">No encuentro una opción que cumpla todo.</div>'}`;bind()}
function makeWeek(){let days=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'],used=[];S.week={};days.forEach(d=>{S.week[d]={};['comida','cena'].forEach(m=>{let c=rec({meal:m,time:d==='sábado'||d==='domingo'?45:30}).filter(x=>!x.bad.length&&!used.includes(x.r.id));if(!c.length)c=rec({meal:m}).filter(x=>!x.bad.length);let r=c[Math.floor(Math.random()*Math.min(4,c.length))]?.r;if(r){S.week[d][m]=r.id;used.push(r.id)}})});save();render()}render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
